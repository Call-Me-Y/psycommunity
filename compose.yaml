services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-psycommunity}
      POSTGRES_USER: ${DB_USER:-psycommunity}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-psycommunity}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-psycommunity}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JPA_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPLOAD_DIR: /app/data/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      BOOTSTRAP_ADMIN_UID: ${BOOTSTRAP_ADMIN_UID:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      AGENT_API_URL: ${AGENT_API_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      EMOTION_MODEL_ENABLED: ${EMOTION_MODEL_ENABLED:-false}
      EMOTION_MODEL_PATH: /opt/psycommunity/emotion-model
      EMOTION_ALERT_THRESHOLD: ${EMOTION_ALERT_THRESHOLD:-0.80}
    volumes:
      - app-data:/app/data
      - type: bind
        source: ${EMOTION_MODEL_PATH:-./models/emotion}
        target: /opt/psycommunity/emotion-model
        read_only: true
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  app-data:
